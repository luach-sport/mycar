name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION: '1.01'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Refresh offline data (road distances, fuel price)
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/fetch-data.mjs

      - name: Save refreshed data to the repo (served to installed apps)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/data
          if git diff --cached --quiet; then echo "data unchanged"; else
            git commit -m "עדכון נתונים לשימוש בלי אינטרנט"
            git push || echo "::warning::could not push data update"
          fi

      - name: Prepare web app (runtime, version)
        run: node scripts/prepare-web.mjs

      - name: Upload web version for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Create Android project
        run: npx cap add android

      - name: Customize Android project
        run: bash scripts/patch-android.sh

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Signing key
        id: key
        env:
          MYCAR_KEY_PASS: ${{ secrets.MYCAR_KEY_PASS }}
        run: |
          if [ -z "$MYCAR_KEY_PASS" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret MYCAR_KEY_PASS is missing, building a test APK only"
          else
            cp signing/release.jks android/app/release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          MYCAR_STORE_PASSWORD: ${{ secrets.MYCAR_KEY_PASS }}
          MYCAR_KEY_PASSWORD: ${{ secrets.MYCAR_KEY_PASS }}
          MYCAR_KEY_ALIAS: mycar
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../mycar.apk
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../mycar.apk
          fi

      - name: Verify APK
        run: |
          ls -la mycar.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs mycar.apk | head -5 || true
          "$BT/aapt" dump badging mycar.apk 2>/dev/null | grep -E "package|sdkVersion|targetSdk|application-label" | head -6 || true

      - name: Publish release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${APP_VERSION}-build${GITHUB_RUN_NUMBER}"
          NOTES=$'MyCar — עד הטיפה האחרונה. גרסה '"${APP_VERSION}"$' (בנייה '"${GITHUB_RUN_NUMBER}"$')\n\nלהתקנה: מורידים את mycar.apk בטלפון ופותחים אותו. בהתקנה הראשונה מאשרים "התקנה ממקור לא ידוע".\nעדכון: מתקינים את הקובץ החדש מעל הקיים. הנתונים נשמרים.'
          gh release create "$TAG" mycar.apk --title "MyCar ${APP_VERSION} (בנייה ${GITHUB_RUN_NUMBER})" --notes "$NOTES" --latest

      - name: Keep the test APK
        if: steps.key.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mycar-test-apk
          path: mycar.apk

      - name: Missing signing password
        if: steps.key.outputs.signed != 'true'
        run: |
          echo "::error::Test build passed, but the APK was not published: add the secret MYCAR_KEY_PASS"
          exit 1

  pages:
    needs: apk
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
