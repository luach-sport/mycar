name: Website

# The public site (GitHub Pages): user guide, download link and fresh screenshots of the app.
# Rebuilt when the guide or the app changes, and after every new app release.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'www/**'
      - 'scripts/site-build.mjs'
      - '.github/workflows/site.yml'
  workflow_run:
    workflows: ['Build APK']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the screenshot browser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Build the site
        run: |
          ln -s "$RUNNER_TEMP/pw/node_modules" node_modules
          node scripts/site-build.mjs

      - name: Publish to the gh-pages branch (GitHub Pages serves it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_RUN_ID}" > _site/build.txt
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "אתר MyCar: עדכון אוטומטי (${GITHUB_SHA::7})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Check the live site
        continue-on-error: true
        run: |
          for i in $(seq 1 30); do
            sleep 10
            LIVE=$(curl -sf "https://luach-sport.github.io/mycar/build.txt?t=$(date +%s)" || true)
            [ "$LIVE" = "${GITHUB_RUN_ID}" ] && break
          done
          B=https://luach-sport.github.io/mycar
          code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          echo "::notice title=live::updated=$([ "$LIVE" = "${GITHUB_RUN_ID}" ] && echo yes || echo no) page=$(code $B/) og=$(code $B/og.jpg) shot=$(code $B/shots/result.jpg) app=$(code $B/app/) version=[$(curl -s $B/ | grep -o 'גרסה [0-9.]*' | head -1)]"
