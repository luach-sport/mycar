name: Website

# The public site (GitHub Pages): user guide, download link and fresh screenshots of the app.
# Rebuilt when the guide or the app changes, and after every new app release.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'www/**'
      - 'scripts/site-build.mjs'
      - '.github/workflows/site.yml'
  workflow_run:
    workflows: ['Build APK']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the screenshot browser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Build the site
        run: |
          ln -s "$RUNNER_TEMP/pw/node_modules" node_modules
          node scripts/site-build.mjs

      - name: Publish to the gh-pages branch (GitHub Pages serves it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "אתר MyCar: עדכון אוטומטי (${GITHUB_SHA::7})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Check the live site
        continue-on-error: true
        run: |
          V=$(grep -o 'גרסה [0-9.]*' _site/index.html | head -1)
          for i in $(seq 1 18); do
            sleep 10
            LIVE=$(curl -sfL "https://luach-sport.github.io/mycar/?t=$(date +%s)" | grep -o 'גרסה [0-9.]*' | head -1 || true)
            if [ -n "$LIVE" ]; then break; fi
          done
          OG=$(curl -s -o /dev/null -w '%{http_code}' https://luach-sport.github.io/mycar/og.jpg)
          SHOT=$(curl -s -o /dev/null -w '%{http_code}' https://luach-sport.github.io/mycar/shots/result.jpg)
          APP=$(curl -s -o /dev/null -w '%{http_code}' https://luach-sport.github.io/mycar/app/)
          echo "::notice title=live::built=[$V] live=[$LIVE] og=$OG shot=$SHOT app=$APP"
