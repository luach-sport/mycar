name: Promo voice
on:
  push:
    branches: [promo-voice]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make the name variants
        run: |
          pip install edge-tts
          python gen2.py
      - name: Transcribe back to check pronunciation
        continue-on-error: true
        run: |
          pip install faster-whisper imageio-ffmpeg
          python check.py > out2/transcripts.txt 2>&1 || true
      - name: Save the clips to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out out2
          git commit -m "Narration clips"
          git push
