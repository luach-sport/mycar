<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6FC">
<meta name="description" content="MyCar – כמה עולה הנסיעה, יומן נסיעות ותדלוקים. עד הטיפה האחרונה.">
<title>MyCar</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon-512.png">
<script>
  (function () {
    try {
      var t = localStorage.getItem('mycar.theme') || 'light';
      if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="screen" tabindex="-1"></main>
</div>
<nav id="tabs" aria-label="ניווט ראשי">
  <div class="inner">
    <button type="button" data-action="tab" data-tab="calc" aria-current="page">
      <span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg></span>
      חישוב
    </button>
    <button type="button" data-action="tab" data-tab="trips">
      <span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      נסיעות
    </button>
    <button type="button" data-action="tab" data-tab="fuel">
      <span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 22h12"/><path d="M4 9h10"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0V9.83a2 2 0 0 0-.59-1.42L18 5"/></svg></span>
      תדלוקים
    </button>
    <button type="button" data-action="tab" data-tab="stats">
      <span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M8 17v-6"/><path d="M13 17V6"/><path d="M18 17v-4"/></svg></span>
      נתונים
    </button>
    <button type="button" data-action="tab" data-tab="settings">
      <span class="ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9"/><path d="M17 6h3"/><circle cx="15" cy="6" r="2"/><path d="M4 12h3"/><path d="M11 12h9"/><circle cx="9" cy="12" r="2"/><path d="M4 18h11"/><circle cx="17" cy="18" r="2"/></svg></span>
      הגדרות
    </button>
  </div>
</nav>
<div id="fab-root"></div>
<div id="sheet-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json,text/plain" hidden>
<script src="cap-runtime.js"></script>
<script src="js/version.js"></script>
<script src="js/core.js"></script>
<script src="js/update.js"></script>
<script src="js/snap.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/share-app.js"></script>
</body>
</html>
